<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Template</title>
</head>
<body>

    <!-- Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph with a line break -->
    <p>This is a sample paragraph explaining the content of the page.<br>
    Here is text on a new line after the line break.</p>

    <!-- Div container holding interactive elements -->
    <div>
        <!-- Input field -->
        <label for="username">Enter your name:</label>
        <input type="text" id="username" placeholder="Type here...">

        <!-- Button -->
        <button type="button">Submit</button>
    </div>

    <!-- Link -->
    <p>Visit <a href="https://www.example.com" target="_blank">Example Website</a> for more information.</p>

    <!-- Image with src and alt -->
    <img src="https://via.placeholder.com/300x150" alt="Placeholder preview image showing dimensions">

</body>
</html>
